# 反无数据生成系统 — 全局默认参数
simulation:
  duration: 300           # 仿真时长 (秒)
  dt: 0.05                # 主时钟步长 (秒)，即 20Hz
  seed: 42                # 随机种子，确保可复现
  start_time: 0.0         # 仿真起始时间戳

# 坐标系统：ENU (East-North-Up)，原点在传感器部署中心
# ENU 原点对应的 WGS84 大地坐标，输出经纬度时使用
coordinates:
  origin: [120.08363526778648, 30.13911824931559, 0.0]  # [经度(°), 纬度(°), 海拔(m)]
  frame: "ENU"                  # ENU / NED / LLA
