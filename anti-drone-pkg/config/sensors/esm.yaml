# 电侦传感器参数
esm:
  id: "esm-01"
  position: [-50.0, 0.0, 8.0]   # x, y, z (m) ENU
  orientation: [0.0, 0.0]        # 方位角, 俯仰角 (度)
  update_rate: 1.0               # Hz (侦测周期)
  fov:
    azimuth: [-180.0, 180.0]     # 方位视场 — 全向
    elevation: [-10.0, 40.0]     # 俯仰视场
  frequency_range: [0.1e9, 18.0e9]  # 频率覆盖 (Hz): 100MHz - 18GHz
  detection:
    poi: 0.8                     # 截获概率 (扫描式)
    sensitivity: -80.0           # 灵敏度 (dBm)
  error:
    azimuth_sigma: 1.0           # 方位随机误差 σ (度)
    frequency_sigma: 1000000.0    # 频率测量误差 σ (Hz) = 1MHz
    pri_quantization: 1.0e-09     # PRI 量化误差 (s)
    pw_quantization: 5.0e-08      # 脉宽量化误差 (s)
  measurement:
    measure_frequency: true
    measure_pri: true
    measure_pw: true
    measure_modulation: true
